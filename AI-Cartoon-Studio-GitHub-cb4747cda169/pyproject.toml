[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cartoon-studio"
version = "0.1.0"
description = "Управляющее ядро мультстудии и отдельный Windows Render Worker"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2", "Pillow>=11,<14"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
voice = ["piper-tts>=1.3,<2"]
align = ["faster-whisper>=1.1,<2"]

[project.scripts]
cartoon-studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

